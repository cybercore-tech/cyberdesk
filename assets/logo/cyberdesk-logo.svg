<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="840" height="210" role="img" aria-label="cyberdesk">
  <defs>
    <filter id="neon2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="core2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d9e"/>
      <stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
  </defs>

  <g transform="translate(130 105) scale(0.86)">
    <g transform="rotate(45)" filter="url(#neon2)">
      <g fill="#0a0d16" stroke-width="6" stroke-linejoin="round">
        <rect x="-78" y="-78" width="44" height="44" rx="8" stroke="#c6ff45"/>
        <rect x="34"  y="-78" width="44" height="44" rx="8" stroke="#c6ff45"/>
        <rect x="-78" y="34"  width="44" height="44" rx="8" stroke="#c6ff45"/>
        <rect x="34"  y="34"  width="44" height="44" rx="8" stroke="#c6ff45"/>
        <rect x="-22" y="-78" width="44" height="44" rx="8" stroke="#22e6ff"/>
        <rect x="-78" y="-22" width="44" height="44" rx="8" stroke="#22e6ff"/>
        <rect x="34"  y="-22" width="44" height="44" rx="8" stroke="#22e6ff"/>
        <rect x="-22" y="34"  width="44" height="44" rx="8" stroke="#22e6ff"/>
      </g>
      <rect x="-22" y="-22" width="44" height="44" rx="8" fill="url(#core2)"/>
      <rect x="-8"  y="-8"  width="16" height="16" rx="3" fill="#06080f"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace" font-weight="700"
     font-size="90" letter-spacing="1" dominant-baseline="middle">
    <text x="300" y="108" fill="#eef3ff">cyber</text>
    <text x="565" y="108" fill="#c6ff45" filter="url(#neon2)">desk</text>
  </g>
  <rect x="790" y="66" width="14" height="78" fill="#22e6ff" opacity="0.9"/>
