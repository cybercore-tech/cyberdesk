{% extends "base.html" %}
{% block title %}{{ heading }} · cyberdesk{% endblock %}
{% block body %}
<div class="wrap">
  <h1>{{ heading }} <span class="muted" style="font-size:1rem">{{ n }}</span></h1>
  <ul>
    {% for it in notes %}
    <li>
      <a href="/n/{{ it.rel | safe }}">{{ it.title }}</a>
      &nbsp;<span class="muted" style="font-size:.78rem">{{ it.rel }}</span>
      {% for t in it.tags %}<a href="/tag/{{ t | safe }}" class="pill {{ 'rev' if t == 'needs-review' }}" style="margin-left:.3rem">{{ t }}</a>{% endfor %}
    </li>
    {% else %}<li class="muted">none</li>{% endfor %}
  </ul>
</div>
{% endblock %}
